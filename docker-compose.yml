# Local MongoDB for the lead finder.
#   docker compose up -d      start
#   docker compose down       stop (data is kept in the mongo_data volume)
services:
  mongo:
    image: mongo:7
    container_name: lead-finder-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
